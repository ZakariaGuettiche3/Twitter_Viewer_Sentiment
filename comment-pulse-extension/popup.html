<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Comment Pulse</title>
<style>
  :root {
    --bg: #14161c;
    --surface: #1b1e26;
    --surface-2: #232733;
    --border: #2b2f3b;
    --text: #f2f3f5;
    --text-dim: #9aa0ac;
    --accent: #f2b705;
    --accent-dim: #7a6110;
    --positive: #3ddc97;
    --neutral: #8b93a7;
    --negative: #ff5c72;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "Cascadia Code", "SF Mono", "Roboto Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    width: 400px;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 13px;
  }

  .app { display: flex; flex-direction: column; }

  /* ---------- Header ---------- */
  .app__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
  }

  .brand { display: flex; align-items: center; gap: 10px; }

  .brand__mark {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    width: 26px;
    height: 26px;
    padding: 5px;
    background: var(--surface-2);
    border-radius: 8px;
    flex: none;
  }
  .brand__mark span {
    display: block;
    width: 3px;
    background: var(--accent);
    border-radius: 2px;
  }
  .brand__mark span:nth-child(1) { height: 35%; }
  .brand__mark span:nth-child(2) { height: 75%; }
  .brand__mark span:nth-child(3) { height: 95%; }
  .brand__mark span:nth-child(4) { height: 55%; }

  .brand__title { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .brand__subtitle { margin: 1px 0 0; font-size: 11px; color: var(--text-dim); }

  .icon-btn {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    cursor: pointer;
    flex: none;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--accent-dim); }
  .icon-btn svg { width: 15px; height: 15px; }

  /* ---------- Settings panel ---------- */
  .settings {
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .field { display: flex; flex-direction: column; gap: 5px; font-size: 11.5px; color: var(--text-dim); }
  .field input {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    padding: 7px 9px;
    font-size: 12.5px;
    font-family: var(--font-ui);
  }
  .field input::placeholder { color: #565c6b; }
  .field input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field small { color: #6b7180; font-size: 10.5px; }

  /* ---------- Main ---------- */
  main { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 14px; }

  .btn {
    appearance: none;
    border: none;
    border-radius: 9px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    font-family: var(--font-ui);
    cursor: pointer;
  }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn--primary { background: var(--accent); color: #1a1400; width: 100%; }
  .btn--primary:hover { background: #ffc61a; }
  .btn--primary:disabled { background: var(--accent-dim); color: #33291a; cursor: not-allowed; }
  .btn--ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn--ghost:hover { border-color: var(--accent-dim); }

  .status { margin: 0; font-size: 12px; color: var(--text-dim); min-height: 16px; }
  .status--error { color: var(--negative); }
  .status--ok { color: var(--positive); }

  /* ---------- Pulse bar (signature element) ---------- */
  .pulse__track {
    display: flex;
    width: 100%;
    height: 14px;
    border-radius: 999px;
    overflow: hidden;
    background: var(--surface-2);
    border: 1px solid var(--border);
  }
  .pulse__segment { height: 100%; width: 0%; }
  .pulse__segment--positive { background: var(--positive); }
  .pulse__segment--neutral { background: var(--neutral); }
  .pulse__segment--negative { background: var(--negative); }
  @media (prefers-reduced-motion: no-preference) {
    .pulse__segment { transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
  }

  .pulse__legend {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 11.5px;
    color: var(--text-dim);
  }
  .pulse__legend b { color: var(--text); font-family: var(--font-mono); font-weight: 600; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
  .dot--positive { background: var(--positive); }
  .dot--neutral { background: var(--neutral); }
  .dot--negative { background: var(--negative); }

  /* ---------- Stat grid ---------- */
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .stat-card__label { font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-card__value { font-family: var(--font-mono); font-size: 19px; font-weight: 600; }
  .stat-card__value--positive { color: var(--positive); }
  .stat-card__value--negative { color: var(--negative); }
  .stat-card__value--neutral { color: var(--neutral); }

  /* ---------- Charts ---------- */
  .chart-block h2 {
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .chart-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
  }

  #results[hidden] { display: none; }
  .results { display: flex; flex-direction: column; gap: 14px; }
</style>
</head>
<body>
  <div class="app">
    <header class="app__header">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <div>
          <h1 class="brand__title">Comment Pulse</h1>
          <p class="brand__subtitle">Sentiment read of this video's comments</p>
        </div>
      </div>
      <button id="settingsToggle" class="icon-btn" aria-label="Settings" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 0 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 0 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15z"></path>
        </svg>
      </button>
    </header>

    <section id="settingsPanel" class="settings" hidden>
      <label class="field">
        <span>YouTube Data API key</span>
        <input type="password" id="apiKeyInput" placeholder="AIza..." autocomplete="off" />
        <small>From a Google Cloud project with the YouTube Data API v3 enabled.</small>
      </label>
      <label class="field">
        <span>Backend URL</span>
        <input type="text" id="backendUrlInput" placeholder="http://localhost:5001" autocomplete="off" />
      </label>
      <label class="field">
        <span>Max comments to read</span>
        <input type="number" id="maxCommentsInput" min="20" max="1000" step="20" />
      </label>
      <button id="saveSettingsBtn" class="btn btn--ghost">Save settings</button>
    </section>

    <main>
      <button id="analyzeBtn" class="btn btn--primary">Analyze comments</button>
      <p id="statusText" class="status">Open a YouTube video, then click Analyze comments to read the room.</p>

      <section id="results" class="results" hidden>
        <div class="pulse">
          <div class="pulse__track">
            <div id="pulsePositive" class="pulse__segment pulse__segment--positive"></div>
            <div id="pulseNeutral" class="pulse__segment pulse__segment--neutral"></div>
            <div id="pulseNegative" class="pulse__segment pulse__segment--negative"></div>
          </div>
          <div class="pulse__legend">
            <span><i class="dot dot--positive"></i>Positive <b id="pctPositive">0%</b></span>
            <span><i class="dot dot--neutral"></i>Neutral <b id="pctNeutral">0%</b></span>
            <span><i class="dot dot--negative"></i>Negative <b id="pctNegative">0%</b></span>
          </div>
        </div>

        <div class="stat-grid">
          <div class="stat-card">
            <span class="stat-card__label">Comments read</span>
            <span class="stat-card__value" id="statTotalComments">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-card__label">Total words</span>
            <span class="stat-card__value" id="statTotalWords">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-card__label">Positive</span>
            <span class="stat-card__value stat-card__value--positive" id="statPositive">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-card__label">Negative</span>
            <span class="stat-card__value stat-card__value--negative" id="statNegative">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-card__label">Neutral</span>
            <span class="stat-card__value stat-card__value--neutral" id="statNeutral">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-card__label">Avg. words / comment</span>
            <span class="stat-card__value" id="statAvgWords">0</span>
          </div>
        </div>

        <div class="chart-block">
          <h2>Sentiment over time</h2>
          <canvas id="timeChart" height="150"></canvas>
        </div>

        <div class="chart-block">
          <h2>Most-used words</h2>
          <canvas id="wordsChart" height="150"></canvas>
        </div>
      </section>
    </main>
  </div>

  <script src="chart.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
